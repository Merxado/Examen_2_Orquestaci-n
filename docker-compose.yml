services:

  bdfestivos:
    build:
      context: ./bdFestivos
    container_name: dockerbdfestivos
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: festivos
    ports:
      - "27018:27017"
    volumes:
      - mongo_festivos_data:/data/db
    networks:
      - redcalendario
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  apifestivos:
    build:
      context: ./apiFestivos
    container_name: dockerapifestivos
    restart: unless-stopped
    environment:
      PORT: 3030
      DB_HOST: bdfestivos
      DB_PORT: 27017
      DB_NAME: festivos
    ports:
      - "3040:3030"
    depends_on:
      bdfestivos:
        condition: service_healthy
    networks:
      - redcalendario

  bdcalendario:
    build:
      context: ./bdCalendario
    container_name: dockerbdcalendario
    restart: unless-stopped
    environment:
      POSTGRES_DB: calendariolaboral
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sa
    ports:
      - "5433:5432"
    volumes:
      - postgres_calendario_data:/var/lib/postgresql/data
    networks:
      - redcalendario
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calendariolaboral"]
      interval: 10s
      timeout: 5s
      retries: 10

  apicalendariolaboral:
    build:
      context: ./apiCalendario
    container_name: dockerapicalendariolaboral
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://bdcalendario:5432/calendariolaboral
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: sa
      FESTIVOS_API_BASE_URL: http://apifestivos:3030/api/festivos
    ports:
      - "8080:8080"
    depends_on:
      bdcalendario:
        condition: service_healthy
      apifestivos:
        condition: service_started
    networks:
      - redcalendario

networks:
  redcalendario:
    driver: bridge

volumes:
  mongo_festivos_data:
  postgres_calendario_data: